[workspace]
resolver = "3"
members = ["workspace_crates/*"]

[workspace.dependencies]
password_hashing = { git = "ssh://git@github.com/Aeroel/password_hashing.git"  }
server = { git = "ssh://git@github.com/Aeroel/server_2_only.git"}
app_config = { path = "workspace_crates/app_config" }
auth_server_structs = { path = "workspace_crates/auth_server_structs" }
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["migrate", "postgres", "macros", "runtime-tokio", "time", "tls-rustls-aws-lc-rs"] }
tracing = "0.1.44"
derive_more = { version = "2.1.1", features = ["full"] }
strum = { version = "0.28.0", features = ["derive"] }
[workspace.package]
version = "0.0.1"